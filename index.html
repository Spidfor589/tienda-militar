<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#0b0c0a">
  <title>ATLAS TÁCTICO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
  <div class="topbar">CATÁLOGO DE EQUIPO TÁCTICO · PERSONAL MILITAR Y DE SEGURIDAD</div>
  <header>
    <div class="logo" onclick="showHome()">ATLAS<span>TÁCTICO</span></div>
    <nav>
      <a href="#" onclick="showHome()">Inicio</a>
      <a href="#" onclick="showHome()">Catálogo</a>
      <a href="#" onclick="showAdminLogin()">Administrador</a>
    </nav>
    <div class="cart-icon" onclick="toggleCartSidebar()">
      🛒 <span id="cart-count" class="cart-badge">0</span>
    </div>
  </header>

  <main id="main-content"></main>

  <div id="cart-sidebar" class="sidebar">
    <div class="sidebar-header">
      <h3>Carrito</h3>
      <button onclick="toggleCartSidebar()">×</button>
    </div>
    <div id="cart-sidebar-items"></div>
    <div class="sidebar-footer">
      <p>Total: S/ <span id="sidebar-total">0.00</span></p>
      <button class="btn" onclick="showCart()">Ver carrito completo</button>
      <button class="btn btn-secondary" onclick="showCheckout()">Realizar compra</button>
    </div>
  </div>
  <div id="overlay" class="overlay" onclick="closeAll()"></div>
  <div id="notification" class="notification"></div>

  <script src="app.js?v=7"></script>
</body>
</html>
